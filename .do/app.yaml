# DigitalOcean App Platform spec
#
# 🔴 ค่าที่เป็นความลับ (LLM_API_KEY, LANGSMITH_API_KEY, API_KEY) **ไม่อยู่ในไฟล์นี้**
# ไฟล์นี้อยู่บน GitHub ที่เป็น public · ตั้งใน DO Console → Settings →
# App-Level Environment Variables แล้วเลือกชนิด **Encrypted** ไม่ใช่ Plain
#
# workers ต้องเป็น 1 · SQLite เป็นไฟล์เดียว หลาย worker เขียนพร้อมกันจะชนกัน
# และหน้าต่าง 100 วิ ต้องเห็นข้อมูลชุดเดียวกัน ไม่ใช่แยกกันคนละ process

name: animalcountllm
region: sgp

# 🔴 เคยมี static_sites: verify-ui ตรงนี้ ถอดออกแล้ว 2026-08-17
# App Platform **ไม่อ่านไฟล์นี้** สำหรับแอปที่สร้างไว้แล้ว spec ตัวจริงอยู่ใน Console
# push ไปแล้วคอมโพเนนต์ไม่เกิด /verify ตอบ 404 จาก FastAPI · หน้าเว็บเลยย้ายไป
# mount ใน app/main.py แทน ซึ่ง deploy_on_push ส่งขึ้นได้เองจริง
#
# บทเรียน: อะไรที่ต้องกดใน Console ถึงจะมีผล **ห้ามเขียนไว้ที่นี่แล้วเชื่อว่ามันจะเกิด**
# ไฟล์นี้เป็นเอกสารว่า spec ควรหน้าตายังไง ไม่ใช่สิ่งที่ deploy อ่าน

services:
  - name: api
    github:
      repo: boonruang/animalcountllm
      branch: main
      deploy_on_push: true

    # basic-xxs = 512 MB · พอสำหรับ numpy/scipy เพราะไม่มี torch ไม่มีโมเดลในเครื่อง
    # ถ้า build ล้มเพราะ memory ค่อยขยับเป็น basic-xs
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080

    # เขียน route ของ service ให้ชัด เพราะมีคอมโพเนนต์ที่สองแล้ว
    # ปล่อยให้ implicit ปนกับ explicit คือที่ที่ routing จะเพี้ยนแบบหาสาเหตุยาก
    routes:
      - path: /

    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1

    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 30
      failure_threshold: 3

    envs:
      # ---- LLM (prod ใช้ OpenRouter เพราะ container ไม่มี GPU)
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      # 🔴 ชื่อต้องตรงกับที่ OpenRouter มีจริง เช็คที่ /api/v1/models ก่อนตั้ง
      # ชื่อผิด = 404 ทุกเฟรม แล้วตกเป็น degraded เงียบๆ ไม่มี error ให้เห็นในหน้า DO
      # (เกิดจริง 2026-08-16: ตั้ง qwen/qwen3-vl-30b-instruct ซึ่งไม่มีอยู่)
      #
      # ทดสอบแล้ว 2026-08-16 ด้วยภาพที่เดาไม่ได้ (ก้อน 7 ก้อน + รหัสสุ่ม K7QZM):
      #   qwen3.7-flash     8.6 วิ  ตอบถูก  ~$0.00007/เฟรม  ~$2.5/เดือน/กล้อง
      #   qwen3.6-35b-a3b   4.9 วิ  ตอบถูก  ~$0.00043/เฟรม  ~$18/เดือน/กล้อง
      # เริ่มจากตัวถูกก่อน แล้วอัปถ้าพิสูจน์ได้ว่าไม่พอ ไม่ใช่จ่ายแพงไว้ก่อนโดยไม่มีหลักฐาน
      #
      # ⚠️ การทดสอบนั้นง่ายเกินกว่าจะตัดสินงานจริง มันวัดได้แค่ว่า "โมเดลเห็นภาพไหม"
      # สิ่งที่ยังไม่ได้วัดคือจุดที่จะพังจริง: ก้อน contrast ต่ำ · วัตถุ 15x10 px ที่อาจหาย
      # ตอนโมเดลย่อภาพ · แยกช้างจากควายจากวัวโดยไม่มีสีไม่มีลาย
      # วัดได้ต่อเมื่อมีภาพจากไซต์จริง ซึ่งยังไม่มี
      #
      # 🔴 เปลี่ยนเป็น VL instruct 2026-08-17 · ตั้งจริงบน DO Console แล้ว ไม่ใช่ไฟล์นี้
      #
      # เริ่มจาก 30b-a3b-instruct ตามที่สั่ง แล้ว **วัดแล้วมันตอบ {"animals":[]} ทุกใบ**
      # ล็อกทีละ provider ครบทั้ง 4 เจ้า (Alibaba/DeepInfra/Novita/SiliconFlow) ว่างเหมือนกันหมด
      # ไม่ใช่ปัญหา routing เป็นตัวโมเดล · เลยลงเอยที่ 32b ซึ่งตอบได้จริงและถูกกว่าด้วย
      #   qwen3-vl-32b-instruct      0.104/0.416 ต่อ 1M  ตอบ unknown x3 conf 0.5
      #   qwen3-vl-30b-a3b-instruct  0.13 /0.52          ตอบ [] ทุกใบ
      #   qwen3.7-flash              0.03 /0.13          ตอบ unknown x3 conf 0.9
      #
      # ⚠️ prompt token เท่ากันหมดทั้งสามตัว (733/751) ที่ภาพ 640x512
      # แปลว่า VL **ไม่ได้** ให้ image token มากกว่าที่ขนาดนี้ เหตุผลเรื่อง tiling ที่เขียนไว้
      # ใน CLAUDE.md ใช้ไม่ได้กับภาพเล็กขนาดนี้ · ช้างไกล 15x10 px ไม่ได้ถูกช่วยด้วยการย้ายมา VL
      - key: LLM_MODEL
        value: qwen/qwen3-vl-32b-instruct
      # 🔴 ปิด thinking ก่อน ค่อยตั้ง max_tokens · วัดจริง 2026-08-16 บน qwen3.7-flash
      #   thinking เปิด: 801 tok, finish=length, ตอบไม่จบแม้ที่ 2000 · 13-34 วิ
      #   thinking ปิด:   73-86 tok, finish=stop, JSON ครบ · 2.9-7.0 วิ
      # 300 = เผื่อจาก 86 ที่วัดได้ · เพิ่มโควตาไม่เคยแก้ปัญหา thinking ได้เลย
      - key: LLM_DISABLE_REASONING
        value: "true"
      - key: LLM_MAX_TOKENS
        value: "300"
      - key: LLM_TIMEOUT_S
        value: "25"

      # ---- LangSmith · ที่เดียวที่ log รอดข้าม deploy เพราะดิสก์ที่นี่ไม่ถาวร
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: animalcountllm
      # เฟรมปกติเก็บ 5% · เฟรมผิดปกติเก็บ 100% เสมอ (โค้ดบังคับ ไม่ได้ตั้งที่นี่)
      - key: LANGSMITH_SAMPLE_RATE
        value: "0.05"

      # ---- storage
      # 🔴 ต้องเป็น /tmp ไม่ใช่ ./data — โฟลเดอร์แอปบน buildpack **เขียนไม่ได้**
      # deploy แรก 2026-08-16 ตายด้วย exit 190 ตอน import เพราะเปิด ./data/animals.db ไม่ได้
      # แล้ว log ขึ้นแค่ 'connection refused' ซึ่งชี้ไปผิดที่ทั้งหมด
      # /tmp หายทุก deploy เหมือนกัน แต่นั่นคือทาง ค. ที่เลือกไว้แล้ว ไม่ได้เสียอะไรเพิ่ม
      - key: STORE_BACKEND
        value: sqlite
      - key: STORE_DSN
        value: /tmp/animalcountllm/animals.db
      - key: RETENTION_DAYS
        value: "7"
      - key: SAVE_IMAGES
        value: interesting
      - key: IMAGE_DIR
        value: /tmp/animalcountllm/frames

      # ---- CV · ต้องจูนใหม่เมื่อได้ภาพจากไซต์จริง (ต้องรู้ FOV และระยะไกลสุด)
      - key: CV_MIN_AREA_PX
        value: "40"

      # ---- ที่เหลือตั้งใน Console เป็น Encrypted:
      #   LLM_API_KEY         (OpenRouter)
      #   LANGSMITH_API_KEY
      #   API_KEY             (กัน endpoint · ว่างไว้ = ใครก็ยิงได้)
