<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elephant Moninting and Notification System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#fff; }
  #drop { border:2px dashed #ced4da; border-radius:.5rem; padding:2.5rem 1rem;
          text-align:center; color:#6c757d; cursor:pointer; transition:.15s; }
  #drop.over, #drop:hover { border-color:#0d6efd; background:#f8f9ff; color:#0d6efd; }
  #preview { max-height:300px; border-radius:.5rem; }
  pre { background:#f8f9fa; border:1px solid #dee2e6; border-radius:.5rem;
        padding:.75rem; max-height:380px; overflow:auto; font-size:.8rem; }
  .count { font-size:2rem; font-weight:700; line-height:1; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1 text-uppercase">
      Elephant Moninting and Notification System
    </span>
  </div>
</nav>

<main class="container py-4" style="max-width:900px">

  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-7">
          <label for="key" class="form-label">X-API-Key <span class="text-danger">*</span></label>
          <input id="key" type="password" class="form-control" autocomplete="off" required>
          <div class="form-text">จำเป็นต้องใส่ ขอคีย์จาก admin</div>
        </div>
        <div class="col-md-5">
          <label for="cam" class="form-label">Camera ID <span class="text-danger">*</span></label>
          <input id="cam" type="text" class="form-control" placeholder="dummycam-01">
          <div class="form-text" id="health">กำลังเช็คสถานะระบบ</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div id="drop">ลากภาพมาวาง หรือคลิกเพื่อเลือกไฟล์</div>
      <input id="file" type="file" accept="image/*" hidden>
      <div class="text-center mt-3"><img id="preview" class="img-fluid d-none" alt=""></div>
      <div class="d-grid mt-3">
        <button id="go" class="btn btn-primary btn-lg" disabled>ตรวจภาพ</button>
      </div>
      <div id="warn" class="alert alert-warning mt-3 mb-0 d-none"></div>
    </div>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), file = $('#file'), img = $('#preview'), go = $('#go'), out = $('#out');
let b64 = null, objUrl = null;

const LABEL = { elephant:'ช้าง', cattle:'วัว/ควาย', human:'คน',
                other_animal:'สัตว์อื่น', unknown:'ระบุไม่ได้' };
const BADGE = { ok:'success', provisional:'warning', degraded:'warning', error:'danger' };

fetch('/healthz').then(r => r.json()).then(h => {
  $('#health').innerHTML =
    `ระบบ <span class="text-${h.status === 'ok' ? 'success' : 'warning'}">${esc(h.status)}</span> · ${esc(h.model)}`;
}).catch(() => { $('#health').innerHTML = '<span class="text-danger">ระบบไม่ตอบ</span>'; });

drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
file.onchange = () => load(file.files[0]);

function load(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = () => {
    // อยู่ในหน่วยความจำแท็บนี้เท่านั้น ไม่มี localStorage ไม่ส่งไปที่อื่นนอกจาก API
    b64 = r.result.split(',')[1];
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    img.src = objUrl; img.classList.remove('d-none');
    drop.textContent = `${f.name} · ${(f.size/1024).toFixed(0)} KB`;
    go.disabled = false;
  };
  r.readAsDataURL(f);
}

function warn(msg) {
  const w = $('#warn');
  if (!msg) return w.classList.add('d-none');
  w.textContent = msg; w.classList.remove('d-none');
}

go.onclick = async () => {
  const key = $('#key').value.trim();
  const cam = $('#cam').value.trim();
  // คีย์เป็นของบังคับฝั่งนี้ด้วย ไม่ปล่อยให้ยิงเปล่าแล้วไปเจอ 401
  if (!key) { warn('ต้องใส่ X-API-Key ก่อน ขอคีย์จาก admin'); $('#key').focus(); return; }
  if (!cam) { warn('ต้องใส่ Camera ID ก่อน'); $('#cam').focus(); return; }
  warn(null);

  go.disabled = true;
  go.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังตรวจ';
  out.innerHTML = '<div class="alert alert-info">กำลังประมวลผล อาจใช้เวลาถึง 25 วินาที</div>';
  try {
    const res = await fetch('/v1/frames', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
      body: JSON.stringify({ camera_id: cam, image_base64: b64 })
    });
    const j = await res.json();
    if (res.status === 401) {
      out.innerHTML = '<div class="alert alert-danger mb-0">X-API-Key ไม่ถูกต้อง ตรวจกับ admin อีกครั้ง</div>';
    } else if (!res.ok) {
      out.innerHTML = `<div class="alert alert-danger mb-0">ผิดพลาด HTTP ${res.status} · ${esc(j.detail ?? '')}</div>`;
    } else {
      render(j);
    }
  } catch (e) {
    out.innerHTML = `<div class="alert alert-danger mb-0">ติดต่อระบบไม่ได้: ${esc(String(e))}</div>`;
  } finally {
    go.disabled = false; go.textContent = 'ตรวจภาพ';
    b64 = null;  // ทิ้ง base64 หลังยิงเสร็จ ไม่ค้างในหน้า
  }
};

function render(j) {
  const animals = (j.raw.animals || []).filter(a => a.count > 0);
  const cards = animals.length
    ? `<div class="row g-2 mb-3">${animals.map(a => `
        <div class="col-6 col-md-3">
          <div class="card h-100 text-center">
            <div class="card-body py-3">
              <div class="count">${a.count}</div>
              <div>${LABEL[a.species] ?? esc(a.species)}</div>
              <div class="text-muted small">มั่นใจ ${(a.confidence*100).toFixed(0)}%</div>
            </div>
          </div>
        </div>`).join('')}</div>`
    : '<p class="fs-5 text-muted">ไม่พบสัตว์ในภาพ</p>';

  out.innerHTML = `
    <div class="card">
      <div class="card-body">
        <div class="mb-3">
          <span class="badge text-bg-${BADGE[j.status] ?? 'secondary'}">${esc(j.status)}</span>
          <span class="badge text-bg-light border">${j.filtered.accepted ? 'ผ่านตัวกรอง' : 'ตัวกรองไม่รับ'}</span>
          <span class="badge text-bg-light border">${esc(j.filtered.state)}</span>
        </div>
        ${cards}
        <table class="table table-sm mb-3">
          <tbody>
            <tr><th class="text-muted fw-normal" style="width:40%">ความมั่นใจรวม</th>
                <td>${(j.raw.overall_confidence*100).toFixed(0)}%</td></tr>
            <tr><th class="text-muted fw-normal">เหตุผลตัวกรอง</th><td>${esc(j.filtered.reason)}</td></tr>
            <tr><th class="text-muted fw-normal">โมเดล</th>
                <td>${esc(j.model.name)} <span class="text-muted">(${esc(j.model.prompt_version)})</span></td></tr>
            <tr><th class="text-muted fw-normal">เวลาที่ใช้</th><td>${(j.timing_ms.total/1000).toFixed(1)} วินาที</td></tr>
            <tr><th class="text-muted fw-normal">Request ID</th>
                <td class="font-monospace small">${esc(j.request_id)}</td></tr>
          </tbody>
        </table>
        <details><summary class="text-muted small">ดูข้อมูลดิบทั้งหมด</summary>
          <pre class="mt-2 mb-0">${esc(JSON.stringify(j, null, 2))}</pre></details>
      </div>
    </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
